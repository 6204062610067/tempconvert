# nginx under the platform's constraints: read-only root filesystem, uid 10001,
# no capabilities. Every path nginx writes to is moved under /tmp, which is the
# one directory the platform always mounts as writable scratch.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Defaults for these live under /var/cache/nginx, which is read-only here.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  server {
    # 3000, not 80: the container runs as uid 10001 and cannot bind a
    # privileged port. This must match deploy.port in platform.yaml.
    listen 3000;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # What the readiness and liveness probes call. Answered by nginx itself so
    # it stays true even if the site's files are missing.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
